name: Release

# Publishes a release whenever src/manifest.json has a version that
# hasn't been released yet. Workflow: edit -> bump version -> push.
on:
  push:
    branches: [main]
    paths: ["src/**", "build.py", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          V=$(python3 -c "import json; print(json.load(open('src/manifest.json'))['version'])")
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

      - name: Skip if already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.version.outputs.tag }} exists; bump the version in src/manifest.json to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.check.outputs.skip != 'true'
        run: python3 build.py

      - name: Publish release
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            dist/gruvbox-soft.xpi dist/update.json \
            --target "$GITHUB_SHA" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes
